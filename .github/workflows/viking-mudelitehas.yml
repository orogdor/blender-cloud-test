name: Mudelitehas 8000 - Tase 2 - Viiking
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'viking_mudelitehas/**'
      - '.github/workflows/viking-mudelitehas.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install point-cloud reconstruction and Blender tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy python3-scipy python3-pil python3-venv
          python3 -m venv --system-site-packages /tmp/viking-venv
          /tmp/viking-venv/bin/pip install --disable-pip-version-check open3d==0.19.0
          blender --version
      - name: Four 2D views then oriented 3D cloud then Poisson mesh
        run: /tmp/viking-venv/bin/python viking_mudelitehas/reconstruct.py
      - name: Blender retopology EXACT 8000 quads GLB BLEND equipment and real renders
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python-exit-code 1 --python viking_mudelitehas/build.py
      - name: Verify reconstruction, mesh and export integrity
        run: |
          python3 - <<'PY'
          import json,os
          p='output/viking_mudelitehas'
          d=json.load(open(p+'/validation.json'))
          assert d['body_quads']==8000,d
          assert d['body_connected_components']==1,d
          assert d['body_boundary_edges']==0 and d['body_nonmanifold_edges']==0,d
          for filename in ['Viking_Mudelitehas_8000_Level2.glb',
              'Viking_Mudelitehas_8000_Level2.blend','04_oriented_point_cloud.ply',
              '05_poisson_from_cloud.ply','preview.png','front.png','back.png']:
              assert os.path.getsize(p+'/'+filename)>0,filename
          print('VALIDATED:',d)
          PY
      - name: Bundle self-contained web presenter
        run: |
          cp site/viking/index.html output/viking_mudelitehas/index.html
          cp output/viking_mudelitehas/Viking_Mudelitehas_8000_Level2.glb output/viking_mudelitehas/viiking.glb
      - name: Put generated model next to web presenter on GitHub
        run: |
          cp output/viking_mudelitehas/Viking_Mudelitehas_8000_Level2.glb site/viking/viiking.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/viking/viiking.glb
          if ! git diff --cached --quiet; then
            git commit -m "Publish Mudelitehas 8000 Viking Blender GLB for viewer"
            git push
          fi
      - name: Upload BLEND GLB actual renders and genuine point-cloud stages
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mudelitehas-8000-2-viking-real-blender
          path: output/viking_mudelitehas/
          if-no-files-found: warn
          retention-days: 30

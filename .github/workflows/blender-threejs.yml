name: Blender soldier and Three.js
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blender-threejs.yml'
      - 'scripts/**'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: blender-cloud-pages
  cancel-in-progress: true

jobs:
  blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy python3-pil
          blender --version
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python-exit-code 1 --python-expr 'import numpy; print("numpy:", numpy.__version__)'

      - name: Generate soldier GLB, BLEND and previews
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python-exit-code 1 --python scripts/create_soldier.py

      - name: Build anatomical cat from custom 3D vertices
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python-exit-code 1 --python scripts/create_vector_cat.py

      - name: Verify cat mesh and stage Three.js viewer
        run: |
          test -s output/vector_cat/vector_cat.glb
          test -s output/vector_cat/vector_cat.blend
          test -s output/vector_cat/preview.png
          test -s output/vector_cat/side.png
          test -s output/vector_cat/front.png
          test -s output/vector_cat/stats.json
          mkdir -p site/cat/models
          cp output/vector_cat/vector_cat.glb site/cat/models/cat.glb
          cp output/vector_cat/preview.png site/cat/preview.png
          cp output/vector_cat/front.png site/cat/front.png
          cp output/vector_cat/side.png site/cat/side.png
          cat output/vector_cat/stats.json

      - name: Upload vertex cat files
        uses: actions/upload-artifact@v4
        with:
          name: vector-cat-blender-glb-and-previews
          path: output/vector_cat/
          retention-days: 30
          if-no-files-found: error

      - name: Build reference car from custom vertex surfaces
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python-exit-code 1 --python scripts/create_vector_car.py

      - name: Verify car export and stage phone viewer
        run: |
          test -s output/vector_car/vector_car.glb
          test -s output/vector_car/vector_car.blend
          test -s output/vector_car/preview.png
          test -s output/vector_car/front.png
          test -s output/vector_car/side.png
          test -s output/vector_car/rear.png
          test -s output/vector_car/top.png
          test -s output/vector_car/stats.json
          mkdir -p site/car/models
          cp output/vector_car/vector_car.glb site/car/models/vector_car.glb
          cp output/vector_car/preview.png site/car/preview.png
          cp output/vector_car/front.png site/car/front.png
          cp output/vector_car/side.png site/car/side.png
          cp output/vector_car/rear.png site/car/rear.png
          cp output/vector_car/top.png site/car/top.png
          cat output/vector_car/stats.json

      - name: Upload car Blender source, GLB and renders
        uses: actions/upload-artifact@v4
        with:
          name: vector-car-reference-build
          path: output/vector_car/
          retention-days: 30
          if-no-files-found: error

      - name: Verify the generated files
        run: |
          test -s output/soldier.glb
          test -s output/soldier.blend
          test -s output/preview_front.png
          test -s output/preview_side.png
          mkdir -p site/models
          cp output/soldier.glb site/models/soldier.glb
          cp output/preview_front.png site/preview_front.png
          cp output/preview_side.png site/preview_side.png
          du -h output/*

      - name: Upload downloadable Blender files
        uses: actions/upload-artifact@v4
        with:
          name: soldier-build-output
          path: output/
          retention-days: 30
          if-no-files-found: error

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload viewer site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: blender
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish site
        id: publish
        uses: actions/deploy-pages@v4

name: Single Mesh Quad Car
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'quadcar/**'
      - '.github/workflows/quad-car.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy python3-pil
          blender --version
      - name: Generate exactly 998 quads, BLEND, GLB and five views
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python-exit-code 1 --python quadcar/create_quad_car.py
      - name: Validate deliverables and geometry
        run: |
          test -s output/quad_car/quad_car.glb
          test -s output/quad_car/quad_car.blend
          test -s output/quad_car/preview.png
          test -s output/quad_car/front.png
          test -s output/quad_car/rear.png
          test -s output/quad_car/side.png
          test -s output/quad_car/top.png
          python3 - <<'PYCODE'
          import json
          with open('output/quad_car/stats.json') as f: d=json.load(f)
          assert d['mesh_objects']==1, d
          assert d['quad_faces']==998, d
          assert d['nonmanifold_edges']==0, d
          assert d['connected_components']==5, d
          print('Validated:', d)
          PYCODE
      - name: Upload downloadable Blender / GLB / PNG files
        uses: actions/upload-artifact@v4
        with:
          name: quad-car-998-quads
          path: output/quad_car/
          if-no-files-found: error
          retention-days: 30
name: Car Point Cloud to Connected Mesh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pointcloud/**'
      - '.github/workflows/point-cloud-car.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy python3-pil
          blender --version
      - name: Build point cloud and watertight connected mesh
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python-exit-code 1 --python pointcloud/render_auto_cloud.py
      - name: Check output
        run: |
          test -s output/auto_punktipilv/auto_punktipilv_mesh.blend
          test -s output/auto_punktipilv/auto_suletud.glb
          test -s output/auto_punktipilv/mesh.png
          test -s output/auto_punktipilv/punktipilv.png
          python3 - <<'PY'
          import json
          r=json.load(open('output/auto_punktipilv/kontroll.json'))
          assert r['components']==1 and r['boundary_edges']==0 and r['nonmanifold_edges']==0, r
          print(r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: auto-punktipilv-suletud-mesh
          path: output/auto_punktipilv/
          if-no-files-found: error
          retention-days: 30

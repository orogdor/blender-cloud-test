name: Mudelitehas 0.1 - teddy test and release
on:
  push:
    branches: [main]
    paths:
      - 'plugins/mudelitehas/**'
      - 'tests/mudelitehas_v01/**'
      - '.github/workflows/mudelitehas-v01.yml'
  pull_request:
    paths:
      - 'plugins/mudelitehas/**'
      - 'tests/mudelitehas_v01/**'
      - '.github/workflows/mudelitehas-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mudelitehas-v01-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plugins/mudelitehas/skills/mudelitehas/assets/requirements.txt
      - name: Test package and exact original teddy checksums
        run: |
          python -m unittest discover -s tests/mudelitehas_v01 -v
          python -m compileall -q plugins/mudelitehas/skills/mudelitehas
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mudelitehas-runtime
          key: blender-4.5.3-linux-x64-975c58fc-pillow-11.3.0
      - name: Prepare pinned Blender and Pillow
        run: python plugins/mudelitehas/skills/mudelitehas/scripts/install_runtime.py --directory ~/.cache/mudelitehas-runtime
      - name: Install reconstruction dependencies
        run: python -m pip install -r plugins/mudelitehas/skills/mudelitehas/assets/requirements.txt
      - name: Rebuild teddy from reviewed images and validate GLB reimport
        run: |
          python plugins/mudelitehas/skills/mudelitehas/scripts/run.py --workdir "$RUNNER_TEMP/mudelitehas-clean" --blender "$BLENDER" --preview none
      - name: Verify resume skips reconstruction, pose and materials
        run: |
          python plugins/mudelitehas/skills/mudelitehas/scripts/run.py --workdir "$RUNNER_TEMP/mudelitehas-clean" --blender "$BLENDER" --preview none
          python - <<'PY'
          import os,json,pathlib
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'mudelitehas-clean/output/run_manifest.json').read_text())
          steps={s['name']:s for s in d['stages']}
          assert d['status']=='completed'
          for name in ['reconstruction','pose_gate','finish','GLB_reimport']:assert steps[name].get('cached'),steps
          print('Cache reuse passed')
          PY
      - name: Attach rebuilt test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mudelitehas-0.1-rebuild-validation
          path: |
            ${{ runner.temp }}/mudelitehas-clean/output/*validation.json
            ${{ runner.temp }}/mudelitehas-clean/output/run_manifest.json
            ${{ runner.temp }}/mudelitehas-clean/logs/
          if-no-files-found: warn
          retention-days: 30
  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package shareable skill and original teddy example
        run: |
          python - <<'PY'
          import pathlib,shutil,json,hashlib
          pkg=pathlib.Path('plugins/mudelitehas');version=(pkg/'VERSION').read_text().strip();dist=pathlib.Path('dist');dist.mkdir()
          canonical=pkg/'examples/teddy-walk';m=json.loads((canonical/'canonical-manifest.json').read_text())
          for name,entry in m['files'].items():assert hashlib.sha256((canonical/name).read_bytes()).hexdigest()==entry['sha256']
          shutil.make_archive(str(dist/f'Mudelitehas-{version}'),'zip',root_dir='plugins',base_dir='mudelitehas')
          shutil.make_archive(str(dist/f'Mudelitehas-{version}-skill'),'zip',root_dir=pkg/'skills',base_dir='mudelitehas')
          for name in ['Jalutav_Mangukaru_10000.glb','Jalutav_Mangukaru_LOD.glb','Jalutav_Mangukaru_10000.blend','Jalutav_Mangukaru_Uus.gif','canonical-manifest.json']:shutil.copy2(canonical/name,dist/name)
          notes=f'''Mudelitehas {version} testversioon. Jagatav oskus ja Blender 4.5.3 töötluspakett.
          Näidis on viimane jalutav mängukaru: põhikeha 10 000 nelinurka, 23 luud ja Walk_Loop.
          Mudelifailid on algse üle antud mudeli täpsed koopiad; canonical-manifest.json sisaldab räsisid.
          CI ehitab retsepti eraldi uuesti ja kontrollib eksporditud GLB animatsiooni.
          Toetatud automaatne retsept: 10 000 nelinurgaga mängukaru; teised olendid vajavad eraldi arendust.
          Tagasiside: https://github.com/orogdor/blender-cloud-test/issues/new?template=mudelitehas-feedback.yml
          '''
          (dist/'release-notes.md').write_text(notes)
          PY
      - name: Publish immutable test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(cat plugins/mudelitehas/VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserved without replacing assets."
          else
            gh release create "$tag" dist/*.zip dist/*.glb dist/*.blend dist/*.gif dist/canonical-manifest.json --target "$GITHUB_SHA" --title "Mudelitehas $version - jalutav mängukaru" --notes-file dist/release-notes.md --prerelease
          fi

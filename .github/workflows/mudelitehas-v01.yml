name: Mudelitehas 0.1.2 - multiview tests and release
on:
  push:
    branches: [main]
    paths:
      - 'plugins/mudelitehas/**'
      - '.agents/plugins/marketplace.json'
      - 'tests/mudelitehas_v01/**'
      - '.github/workflows/mudelitehas-v01.yml'
  pull_request:
    paths:
      - 'plugins/mudelitehas/**'
      - '.agents/plugins/marketplace.json'
      - 'tests/mudelitehas_v01/**'
      - '.github/workflows/mudelitehas-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mudelitehas-v01-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plugins/mudelitehas/skills/mudelitehas/assets/requirements.txt
      - name: Install reconstruction dependencies
        run: python -m pip install -r plugins/mudelitehas/skills/mudelitehas/assets/requirements.txt
      - name: Test package and exact original teddy checksums
        run: |
          python -m unittest discover -s tests/mudelitehas_v01 -v
          python -m unittest mudelitehas.test_pose_workflow -v
          python -m compileall -q plugins/mudelitehas/skills/mudelitehas
          python plugins/mudelitehas/tools/package_plugin.py --output "$RUNNER_TEMP/plugin-package-check"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mudelitehas-runtime
          key: blender-4.5.3-linux-x64-975c58fc-pillow-11.3.0
      - name: Prepare pinned Blender and Pillow
        run: python plugins/mudelitehas/skills/mudelitehas/scripts/install_runtime.py --directory ~/.cache/mudelitehas-runtime
      - name: Rebuild teddy from reviewed images and validate GLB reimport
        run: |
          python plugins/mudelitehas/skills/mudelitehas/scripts/run.py --workdir "$RUNNER_TEMP/mudelitehas-clean" --blender "$BLENDER" --preview none
      - name: Verify resume skips reconstruction, pose and materials
        run: |
          python plugins/mudelitehas/skills/mudelitehas/scripts/run.py --workdir "$RUNNER_TEMP/mudelitehas-clean" --blender "$BLENDER" --preview none
          python - <<'PY'
          import os,json,pathlib
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'mudelitehas-clean/output/run_manifest.json').read_text())
          steps={s['name']:s for s in d['stages']}
          assert d['status']=='completed'
          for name in ['reconstruction','pose_gate','finish','GLB_reimport']:assert steps[name].get('cached'),steps
          print('Cache reuse passed')
          PY
      - name: Rebuild 0.1.2 car and verify three-direction point gate
        run: |
          python plugins/mudelitehas/skills/mudelitehas/scripts/run_car.py --workdir "$RUNNER_TEMP/car-012-clean" --blender "$BLENDER"
          python - <<'PY'
          import os,json,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'car-012-clean/output'
          gate=json.loads((root/'three_direction_gate.json').read_text())
          assert gate['point_count']==83747 and gate['unresolved_points']==17399,gate
          assert gate['independent_direction_rank']==3 and not gate['feature_triangulation_proven'],gate
          assert json.loads((root/'validation.json').read_text())['quad_faces_total']==5000
          assert json.loads((root/'export_reimport_validation.json').read_text())['status']=='passed'
          PY
      - name: Attach rebuilt test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mudelitehas-0.1-rebuild-validation
          path: |
            ${{ runner.temp }}/mudelitehas-clean/output/*validation.json
            ${{ runner.temp }}/mudelitehas-clean/output/run_manifest.json
            ${{ runner.temp }}/mudelitehas-clean/logs/
            ${{ runner.temp }}/car-012-clean/output/*.json
            ${{ runner.temp }}/car-012-clean/logs/
          if-no-files-found: warn
          retention-days: 30
  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build root-manifest submission ZIP
        run: python plugins/mudelitehas/tools/package_plugin.py --output dist
      - name: Package shareable skill and original teddy example
        run: |
          python - <<'PY'
          import pathlib,shutil,json,hashlib
          pkg=pathlib.Path('plugins/mudelitehas');version=(pkg/'VERSION').read_text().strip();dist=pathlib.Path('dist');dist.mkdir(exist_ok=True)
          canonical=pkg/'examples/teddy-walk';m=json.loads((canonical/'canonical-manifest.json').read_text())
          for name,entry in m['files'].items():assert hashlib.sha256((canonical/name).read_bytes()).hexdigest()==entry['sha256']
          shutil.make_archive(str(dist/f'Mudelitehas-{version}'),'zip',root_dir='plugins',base_dir='mudelitehas')
          shutil.make_archive(str(dist/f'Mudelitehas-{version}-skill'),'zip',root_dir=pkg/'skills',base_dir='mudelitehas')
          for name in ['Jalutav_Mangukaru_10000.glb','Jalutav_Mangukaru_LOD.glb','Jalutav_Mangukaru_10000.blend','Jalutav_Mangukaru_Uus.gif','canonical-manifest.json']:shutil.copy2(canonical/name,dist/name)
          car=pkg/'examples/car-5000'
          for name in ['Auto_5000_3vaate_test.glb','Auto_5000_3vaate_test.blend','Auto_5000_eelvaade.png','three_view_test.json']:shutil.copy2(car/name,dist/name)
          shutil.copy2(car/'canonical-manifest.json',dist/'car-canonical-manifest.json')
          notes=f'''Mudelitehas {version} testversioon. Jagatav oskus ja Blender 4.5.3 töötluspakett.
          0.1.2: iga uue mudeli punkti paigutus kontrollitakse vähemalt kolmes vaates ja kolmes sõltumatus suunas enne meshi.
          Kaasas 5000 kogu-mudeli nelinurgaga auto retsept. 83 747 punkti, 79.22% kolme suuna siluetitoetust; vastuolud säilivad.
          Vana karu allpool on ajalooline kahe-suuna kordusnäidis ega vasta uue mudeli 0.1.2 reeglile.
          Avaldamiseks ette valmistatud portable plugin: laadi portaali üles ainult -plugin.zip fail.
          Sisaldab ametlikku manifesti, ikoone, karu eelvaadet ja repo pluginakataloogi.
          OpenAI kataloogi üleslaadimine ning heakskiit on veel tegemata; töövoo versioon on 0.1.2.
          Näidis on viimane jalutav mängukaru: põhikeha 10 000 nelinurka, 23 luud ja Walk_Loop.
          Mudelifailid on algse üle antud mudeli täpsed koopiad; canonical-manifest.json sisaldab räsisid.
          CI ehitab retsepti eraldi uuesti ja kontrollib eksporditud GLB animatsiooni.
          Uue töövoo automaatne retsept: 5000 nelinurgaga auto. Ajalooline 10 000 nelinurgaga karu on kordamiseks; teised objektid vajavad eraldi retsepti.
          Tagasiside: https://github.com/orogdor/blender-cloud-test/issues/new?template=mudelitehas-feedback.yml
          '''
          (dist/'release-notes.md').write_text(notes)
          PY
      - name: Publish immutable test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(cat plugins/mudelitehas/VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserved without replacing assets."
          else
            gh release create "$tag" dist/*.zip dist/*.glb dist/*.blend dist/*.gif dist/*.png dist/*manifest.json dist/three_view_test.json --target "$GITHUB_SHA" --title "Mudelitehas $version - kolme suuna punktipaigutus" --notes-file dist/release-notes.md --prerelease
          fi

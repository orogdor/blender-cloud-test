<!doctype html>
<html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1520"><title>Vector Car V1 • Three.js</title>
<style>
:root{color-scheme:dark;--c:#e7f1f6;--muted:#9cb3c1;--accent:#7cdecb}*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px system-ui,-apple-system,Segoe UI,sans-serif;background:#08121b;color:var(--c)}main{position:relative;width:100%;height:100dvh;min-height:470px;overflow:hidden;background:radial-gradient(ellipse at 48% 43%,#274150 0%,#142732 49%,#07121d 100%)}canvas{display:block;width:100%;height:100%;touch-action:none}header{pointer-events:none;position:absolute;top:max(13px,env(safe-area-inset-top));left:16px;right:16px;display:flex;align-items:start;justify-content:space-between;gap:16px}header>*{pointer-events:auto}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.16em}.title{margin:5px 0;font-size:clamp(21px,4vw,28px);letter-spacing:-.035em}.info{max-width:355px;font-size:12px;color:var(--muted);line-height:1.5}.status{white-space:nowrap;border-radius:99px;border:1px solid #ffffff2a;padding:8px 12px;background:#081921b9;font-size:11px}.stage-bottom{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}.metrics{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:11px}.metrics span{border-radius:99px;padding:4px 9px;background:#081921b9;border:1px solid #ffffff17}.tools{pointer-events:auto;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:760px;padding:8px;border:1px solid #ffffff20;background:#0a1a23d9;backdrop-filter:blur(14px);border-radius:16px;box-shadow:0 13px 48px #0005}.tools button,.tools a{border:1px solid #ffffff1e;background:#263e49;color:var(--c);border-radius:10px;padding:10px 12px;min-height:38px;font:600 12px system-ui;text-decoration:none;cursor:pointer;touch-action:manipulation}.tools .active{background:#2f796e;border-color:#75dfba66}.tools a{background:#316b5c}#loader{position:absolute;top:54%;left:50%;transform:translate(-50%,-50%);background:#081a23ee;border:1px solid #ffffff25;border-radius:13px;padding:15px 23px;text-align:center;min-width:210px;color:#d4e6e9}#loader[hidden]{display:none}@media(max-width:390px){header{left:10px;right:10px}.title{font-size:20px}.info{max-width:240px}.status{font-size:10px;padding:7px}.tools{gap:4px;padding:6px}.tools button,.tools a{font-size:11px;padding:9px 10px}}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head><body><main id="stage"><header><section><div class="eyebrow">BLENDER CLOUD • VECTOR MESH</div><h1 class="title">Valge luukpära – 3D</h1><div class="info">Sinu nelja vaatega pildi järgi kujundatud 3D-testmudel. Pööra ühe sõrmega ja suumi kahe sõrmega.</div></section><div class="status" id="state">Laen mudelit…</div></header><div id="loader">Laen auto GLB-mudelit…</div><div class="stage-bottom"><div class="metrics"><span id="meshcount">Mesh: …</span><span id="tricount">Kolmnurgad: …</span><span id="metric">Pikkus: …</span></div><div class="tools"><button id="persp">3/4 vaade</button><button id="front">Eest</button><button id="side">Küljelt</button><button id="rear">Tagant</button><button id="top">Ülalt</button><button id="spin" class="active">↻ Pööra</button><button id="wire">Võrk</button><a href="models/vector_car.glb" download="vector_car.glb">↓ GLB</a></div></div></main>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),host=$('stage');
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(43,1,.05,100);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.insertBefore(renderer.domElement,host.firstChild);
scene.add(new THREE.HemisphereLight(0xd3ecff,0x2b313b,2.3));
const sun=new THREE.DirectionalLight(0xffeee0,3.1);sun.position.set(-5,8,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-8;sun.shadow.camera.right=8;sun.shadow.camera.top=8;sun.shadow.camera.bottom=-8;scene.add(sun);
const rim=new THREE.DirectionalLight(0xc9f1fb,2.1);rim.position.set(5,4,-6);scene.add(rim);
const platform=new THREE.Mesh(new THREE.CircleGeometry(7.7,84),new THREE.MeshStandardMaterial({color:0x263d47,roughness:.92}));platform.rotation.x=-Math.PI/2;platform.position.y=-.02;platform.receiveShadow=true;scene.add(platform);
const grid=new THREE.GridHelper(12,30,0x547d84,0x32545e);grid.material.transparent=true;grid.material.opacity=.22;grid.position.y=.003;scene.add(grid);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=2;controls.maxDistance=13;controls.maxPolarAngle=Math.PI*.90;
const pivot=new THREE.Group();scene.add(pivot);let car=null,spin=true,wires=false;
function setView(v){controls.target.set(0,.68,0);let p={persp:[5,3.0,6.2],front:[0,1.7,7.4],side:[7.4,1.7,0],rear:[0,1.7,-7.4],top:[.005,8,.005]}[v]||[5,3,6.2];camera.position.set(...p);controls.update();}
const turnOff=()=>{spin=false;$('spin').classList.remove('active')};
for(const view of ['persp','front','side','rear','top'])$(view).onclick=()=>{turnOff();pivot.rotation.y=0;setView(view)};
$('spin').onclick=()=>{spin=!spin;$('spin').classList.toggle('active',spin)};
$('wire').onclick=()=>{wires=!wires; if(car)car.traverse(o=>{if(o.isMesh){for(const m of (Array.isArray(o.material)?o.material:[o.material]))m.wireframe=wires}});$('wire').classList.toggle('active',wires)};
const loader=new GLTFLoader();loader.load('models/vector_car.glb',({scene:root})=>{
 car=root;pivot.add(car);car.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(car),sz=b.getSize(new THREE.Vector3());
 // GLB from Blender exports Y-up; anchor model on ground and center horizontally.
 const c=b.getCenter(new THREE.Vector3());car.position.sub(new THREE.Vector3(c.x,b.min.y,c.z));car.updateMatrixWorld(true);
 let triangles=0,meshes=0;car.traverse(o=>{if(!o.isMesh)return;meshes++;o.castShadow=true;o.receiveShadow=true;const g=o.geometry;if(g.index)triangles+=g.index.count/3;else if(g.attributes.position)triangles+=g.attributes.position.count/3});
 $('meshcount').textContent='Objekte: '+meshes;$('tricount').textContent='Kolmnurgad: '+Math.round(triangles).toLocaleString('et-EE');$('metric').textContent='Pikkus: '+Math.max(...sz.toArray()).toFixed(2)+' m';
 $('state').textContent='✓ Mudel avatud';$('loader').hidden=true;setView('persp');
},undefined,e=>{console.error(e);$('state').textContent='Laadimisviga';$('loader').textContent='3D-mudel pole veel avaldatud. Kontrolli GitHub Actionsi käivitust.'});
const resize=()=>{const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)};window.addEventListener('resize',resize);resize();setView('persp');let prev=performance.now();function draw(t){requestAnimationFrame(draw);let dt=Math.min(.04,(t-prev)/1000);prev=t;if(spin&&car)pivot.rotation.y+=dt*.16;controls.update();renderer.render(scene,camera)}requestAnimationFrame(draw);
</script></body></html>

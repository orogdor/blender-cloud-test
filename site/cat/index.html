<!doctype html><html lang="et"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#101b27"/><title>Vector Cat • Blender Cloud</title>
<style>
:root{color-scheme:dark;--bg:#0c1721;--fg:#f2f7f6;--muted:#b9c9d0;--accent:#eec38d}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--fg);background:var(--bg)}main{height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 44%,#2d4b57 0%,#152b38 43%,#0a1520 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
header{position:absolute;left:16px;right:16px;top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:10px;pointer-events:none}header>*{pointer-events:auto}h1{font-size:clamp(22px,4vw,31px);margin:4px 0;letter-spacing:-.05em;line-height:1.15}.overline{color:var(--accent);font-size:11px;letter-spacing:.12em;font-weight:800}.desc{font-size:12px;color:var(--muted);max-width:320px}.status{background:#142b35cc;border:1px solid #ffffff29;box-shadow:0 5px 30px #0003;border-radius:40px;font-size:11px;padding:9px 12px;white-space:nowrap;max-height:36px}
footer{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}.meta{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;color:#e2f0ed;font-size:11px}.meta span{padding:4px 8px;border-radius:22px;background:#0f2832b8;border:1px solid #ffffff13}.buttons{pointer-events:auto;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:740px;padding:9px;border-radius:16px;border:1px solid #ffffff24;background:#0f2230e5;backdrop-filter:blur(15px);box-shadow:0 15px 30px #0005}
button,a.download{min-height:39px;font:600 12px system-ui,sans-serif;border:1px solid #ffffff22;background:#284151;color:#f5ffff;border-radius:10px;padding:10px 12px;cursor:pointer;text-decoration:none}button.selected{background:#886443;border-color:#e1a66f7c}a.download{background:#246956}#loading{position:absolute;top:54%;left:50%;transform:translate(-50%,-50%);border-radius:12px;border:1px solid #ffffff24;background:#0b222be7;padding:14px 20px;color:#dce7e4;text-align:center;min-width:210px}
@media(max-width:400px){.buttons{padding:6px;gap:5px}button,a.download{padding:9px;font-size:11px}.status{padding:7px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head>
<body><main id="stage"><header><div><div class="overline">BLENDER CLOUD / CUSTOM VERTEX MESH</div><h1>Vektoritest kass</h1><div class="desc">Täpne punktvõrk, mitte kuubikutest ehitatud kass. Pööra sõrmega ja suumi kahega.</div></div><div id="status" class="status">Laadimine…</div></header>
<div id="loading">Laen 3D-mudelit…</div><footer><div class="meta"><span id="meshes">Osad: …</span><span id="triangles">Kolmnurgad: …</span><span>Blender → GLB → Three.js</span></div><div class="buttons"><button id="front">Eest</button><button id="side">Küljelt</button><button id="back">Tagant</button><button id="turn" class="selected">↻ Pööra</button><button id="wire">Võrk</button><button id="reset">Lähtesta</button><a class="download" href="./models/cat.glb" download="vector_cat.glb">↓ GLB</a></div></footer></main>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id),stage=$('stage');const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(39,1,.02,100);const ren=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});ren.setPixelRatio(Math.min(devicePixelRatio||1,1.8));ren.outputColorSpace=THREE.SRGBColorSpace;ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.35;ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;stage.prepend(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffe3d2,0x3e5364,2.8));const key=new THREE.DirectionalLight(0xffe8cb,3.6);key.position.set(3,6,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-3;key.shadow.camera.right=3;key.shadow.camera.top=3;key.shadow.camera.bottom=-3;scene.add(key);const rim=new THREE.DirectionalLight(0xb4eed9,2);rim.position.set(-4,3,-4);scene.add(rim);
const pad=new THREE.Mesh(new THREE.CircleGeometry(2.3,70),new THREE.MeshStandardMaterial({color:0x2a4752,roughness:.95,transparent:true,opacity:.8}));pad.rotation.x=-Math.PI/2;pad.position.y=-.016;pad.receiveShadow=true;scene.add(pad);const grid=new THREE.GridHelper(3.5,16,0x7aa79b,0x426975);grid.position.y=.002;grid.material.transparent=true;grid.material.opacity=.24;scene.add(grid);
const control=new OrbitControls(cam,ren.domElement);control.enablePan=false;control.enableDamping=true;control.dampingFactor=.075;control.minDistance=.7;control.maxDistance=10;control.minPolarAngle=.09;control.maxPolarAngle=Math.PI*.92;const turntable=new THREE.Group();scene.add(turntable);let cat=null,rotate=true,wire=false;let d=2.5;
function view(n){const pose={front:[0,1.06,d],side:[d,1.1,0],back:[0,1.06,-d],home:[d*.68,1.35,d*.82]}[n]||[2,1,3];cam.position.set(...pose);control.target.set(0,.73,0);control.update()}
for(const n of ['front','side','back'])$(n).onclick=()=>{rotate=false;$('turn').classList.remove('selected');view(n)}; $('turn').onclick=()=>{rotate=!rotate;$('turn').classList.toggle('selected',rotate)};
function setWire(v){wire=v;cat?.traverse(o=>{if(o.isMesh){const m=Array.isArray(o.material)?o.material:[o.material];m.forEach(x=>x.wireframe=v)}});$('wire').classList.toggle('selected',v)}
$('wire').onclick=()=>setWire(!wire);$('reset').onclick=()=>{rotate=true;turntable.rotation.y=0;setWire(false);$('turn').classList.add('selected');view('home')};view('home');
new GLTFLoader().load('./models/cat.glb',gltf=>{cat=gltf.scene;turntable.add(cat);const box=new THREE.Box3().setFromObject(cat),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());cat.position.sub(new THREE.Vector3(center.x,box.min.y,center.z));cat.scale.multiplyScalar(1.35/size.y);cat.updateMatrixWorld(true);let objects=0,tri=0;cat.traverse(o=>{if(o.isMesh){objects++;o.castShadow=true;o.receiveShadow=true;tri+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3}});$('meshes').textContent='Meshid: '+objects;$('triangles').textContent='Kolmnurgad: '+Math.round(tri).toLocaleString('et-EE');$('loading').style.display='none';$('status').textContent='✓ 3D avatud';view('home');},undefined,e=>{console.error(e);$('loading').textContent='GLB laadimise viga – kontrolli viimast Actionsi käivitust.';$('status').textContent='Viga'});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;cam.aspect=w/h;cam.updateProjectionMatrix();ren.setSize(w,h,false)}addEventListener('resize',resize);resize();let prev=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-prev)/1000);prev=now;if(rotate&&cat)turntable.rotation.y+=dt*.25;control.update();ren.render(scene,cam)}requestAnimationFrame(frame);
</script></body></html>
